name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      LLM_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: Project/backend/uv.lock
      - name: Install Python and dependencies
        working-directory: Project/backend
        run: uv sync --frozen
      - name: Validate demo data
        working-directory: Project/backend
        run: uv run python ../scripts/validate_data.py
      - name: Run tests
        working-directory: Project/backend
        run: uv run pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Project/frontend/package-lock.json
      - name: Install dependencies
        working-directory: Project/frontend
        run: npm ci
      - name: Lint
        working-directory: Project/frontend
        run: npm run lint
      - name: Build
        working-directory: Project/frontend
        run: npm run build
