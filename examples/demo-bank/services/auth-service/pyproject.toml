[project]
name = "demo-bank-auth-service"
version = "0.1.0"
description = "Password authentication and session management for Demo Bank"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=23.1,<26",
    "PyJWT>=2.9,<3",
    "httpx>=0.27,<1",
    "pydantic[email]>=2.9,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
