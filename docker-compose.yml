services:
  backend:
    # Come back on their own after Docker Desktop or the laptop restarts.
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      DB_PATH: /app/state/app.db
    volumes:
      - app-cache:/app/data/cache
      - app-data:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).close()"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 20s

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_MOCK: ${NEXT_PUBLIC_MOCK:-0}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  app-cache:
  app-data:
